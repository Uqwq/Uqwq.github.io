<!-- language: HTML, file: index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurellia Checker | Проверка статуса</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --primary: #39ff14; /* Кислотно-зеленый */
            --primary-dark: #2bcc0f;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --border: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Шапка */
        header {
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(10, 10, 10, 0.9);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            margin-left: 2rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* Главный контейнер */
        main {
            flex: 1;
            padding: 4rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        /* Левая часть - Текст и цены */
        .hero-content {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        h1 {
            font-size: 3.5rem;
            line-height: 1.1;
            font-weight: 800;
        }

        h1 span {
            color: var(--primary);
            text-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 90%;
        }

        /* Блок с ценами */
        .pricing {
            display: flex;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .price-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            flex: 1;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s;
        }

        .price-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(57, 255, 20, 0.1);
        }

        .price-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--primary);
            transform: scaleX(0);
            transition: transform 0.3s;
            transform-origin: left;
        }

        .price-card:hover::before {
            transform: scaleX(1);
        }

        .price-duration {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .price-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
        }

        .price-value span {
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: 500;
        }

        .btn-buy {
            display: block;
            width: 100%;
            margin-top: 1.5rem;
            padding: 0.8rem;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .btn-buy:hover {
            background: var(--primary);
            color: var(--bg);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.5);
        }

        /* Правая часть - Форма проверки */
        .checker-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .checker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .checker-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--primary);
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(57, 255, 20, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(57, 255, 20, 0); }
            100% { box-shadow: 0 0 0 0 rgba(57, 255, 20, 0); }
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(57, 255, 20, 0.2);
        }

        .btn-check {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            border: none;
            color: var(--bg);
            font-weight: 800;
            font-size: 1.1rem;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.3s, transform 0.1s;
        }

        .btn-check:hover {
            background: var(--primary-dark);
        }

        .btn-check:active {
            transform: scale(0.98);
        }

        .result-area {
            margin-top: 2rem;
            padding: 1.5rem;
            background: var(--bg);
            border: 1px dashed var(--border);
            border-radius: 8px;
            text-align: center;
            color: var(--text-muted);
        }

        /* Адаптивность */
        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
                padding: 2rem 1rem;
            }
            h1 { font-size: 2.5rem; }
            .pricing { flex-direction: column; }
            header { padding: 1rem; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Aurellia</div>
        <div class="nav-links">
            <a href="#">Купить</a>
            <a href="#">Проверка</a>
            <a href="#">Поддержка</a>
        </div>
    </header>

    <main>
        <!-- Левая колонка с текстом и ценами -->
        <div class="hero-content">
            <h1>Проверка статуса <br><span>Aurellia</span></h1>
            <p class="subtitle">Мгновенная проверка блокировок и лицензий. Убедись, что твой доступ активен, перед заходом в игру.</p>
            
            <div class="pricing">
                <!-- Тариф 30 дней -->
                <div class="price-card">
                    <div class="price-duration">30 дней</div>
                    <div class="price-value">499 <span>₽</span></div>
                    <button class="btn-buy">Купить доступ</button>
                </div>
                <!-- Тариф 90 дней -->
                <div class="price-card">
                    <div class="price-duration">90 дней</div>
                    <div class="price-value">999 <span>₽</span></div>
                    <button class="btn-buy">Купить доступ</button>
                </div>
            </div>
        </div>

        <!-- Правая колонка с формой проверки -->
        <div class="checker-panel">
            <div class="checker-header">
                <h2>Панель проверки</h2>
                <div class="status-indicator">
                    <div class="dot"></div>
                    System Online
                </div>
            </div>

            <div class="input-group">
                <label>Ключ лицензии (HWID)</label>
                <input type="text" placeholder="Введите ваш ключ..." id="licenseKey">
            </div>

            <button class="btn-check" onclick="checkStatus()">Проверить</button>

            <div class="result-area" id="resultBox">
                Ожидание ввода данных...
            </div>
        </div>
    </main>

    <script>
        // Простая имитация работы чекера
        function checkStatus() {
            const key = document.getElementById('licenseKey').value;
            const box = document.getElementById('resultBox');
            
            if (!key) {
                box.innerHTML = '<span style="color: #ff4444;">Ошибка: Введите ключ!</span>';
                return;
            }

            box.innerHTML = 'Подключение к серверу...';
            box.style.color = 'var(--text-main)';

            setTimeout(() => {
                // Тут в реальности был бы fetch к API
                if (key.toLowerCase().includes('aurellia')) {
                    box.innerHTML = '<span style="color: var(--primary); font-weight: bold;">УСПЕХ: Лицензия активна. Добро пожаловать!</span>';
                } else {
                    box.innerHTML = '<span style="color: #ff4444; font-weight: bold;">ОШИБКА: Ключ не найден или истек срок действия.</span>';
                }
            }, 1000);
        }
    </script>
</body>
</html>
